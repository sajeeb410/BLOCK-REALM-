<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="robots"
    content="noindex, nofollow"
>

<title>Blockrealm Admin</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
>


<style>

:root {

    --cave: #15151b;

    --obsidian: #1b1428;
    --obs-hi: #3d2d63;
    --obs-lo: #07040c;

    --ink: #0b0b0e;

    --paper: #f3f1f8;

    --muted: #b9b2cc;

    --gold: #ffcc33;

    --red: #e0452f;
    --red-hi: #ff7a5f;
    --red-lo: #7c1c10;

    --font-display:
        "Press Start 2P",
        "Courier New",
        monospace;

    --font-body:
        "VT323",
        "Courier New",
        monospace;
}


* {
    box-sizing: border-box;
}


[hidden] {
    display: none !important;
}


html,
body {
    height: 100%;
}


body {

    margin: 0;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 30%,
            #292438 0%,
            var(--cave) 55%,
            #08080b 100%
        );

    color: var(--paper);

    font-family: var(--font-body);
}


/* =================================
   CAVE ROCK TEXTURE
================================= */

.cave {

    position: fixed;

    inset: 0;

    overflow: hidden;

    z-index: 0;
}


.cave::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(90,70,120,.25) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 75% 35%,
            rgba(90,70,120,.18) 0 3px,
            transparent 4px
        ),

        radial-gradient(
            circle at 40% 70%,
            rgba(70,60,90,.2) 0 2px,
            transparent 3px
        );

    background-size:
        90px 80px,
        130px 110px,
        170px 140px;

    opacity: .7;
}


/* =================================
   TORCH
================================= */

.torch {

    position: absolute;

    width: 22px;

    height: 60px;

    background: #5b3925;

    border: 3px solid #24160e;

    box-shadow:
        4px 4px 0 #0a0705;
}


.torch::before {

    content: "";

    position: absolute;

    width: 32px;

    height: 40px;

    left: -8px;

    top: -34px;

    background:

        radial-gradient(
            circle,
            #fff2a1 0 15%,
            #ffb52e 30%,
            #ff5a19 55%,
            transparent 70%
        );

    filter: blur(2px);

    animation: flicker .12s infinite alternate;
}


.torch-left {

    left: 9%;

    top: 25%;
}


.torch-right {

    right: 9%;

    top: 25%;
}


@keyframes flicker {

    from {
        transform: scale(.85);
        opacity: .75;
    }

    to {
        transform: scale(1.1);
        opacity: 1;
    }
}


/* =================================
   LAVA FLOOR
================================= */

.lava {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 19vh;

    min-height: 110px;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0 40px,
            rgba(255,190,30,.12) 40px 44px
        ),

        linear-gradient(
            #8e281b,
            #4d110b
        );

    border-top:
        8px solid #ff5b1f;

    box-shadow:

        0 -10px 30px rgba(255,60,20,.3);

    z-index: 1;

    animation: lavaGlow 2s ease-in-out infinite alternate;
}


@keyframes lavaGlow {

    from {
        filter: brightness(.85);
    }

    to {
        filter: brightness(1.08);
    }
}


/* =================================
   ADMIN PANEL
================================= */

.panel-wrapper {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 5;

    padding-bottom: 5vh;

    padding-left: 16px;
    padding-right: 16px;
}


.admin-panel {

    width: min(
        460px,
        100%
    );

    padding: 30px;

    background: var(--obsidian);

    border:

        5px solid var(--obs-lo);

    box-shadow:

        inset 5px 5px 0 var(--obs-hi),

        inset -5px -5px 0 #050307,

        12px 12px 0 rgba(0,0,0,.5);
}


/* =================================
   RESTRICTED HEADER
================================= */

.restricted {

    margin:

        -30px
        -30px
        25px
        -30px;

    padding: 12px;

    text-align: center;

    color: #160504;

    font-family: var(--font-display);

    font-size: 9px;

    background:

        repeating-linear-gradient(
            -45deg,
            var(--gold) 0 14px,
            #161616 14px 28px
        );

    border-bottom:
        5px solid var(--obs-lo);

    text-shadow:
        1px 1px 0 rgba(255,255,255,.3);
}


/* =================================
   TITLE
================================= */

.logo {

    text-align: center;

    margin-bottom: 28px;
}


.logo h1 {

    margin: 0;

    font-family: var(--font-display);

    font-size: clamp(
        18px,
        4vw,
        27px
    );

    line-height: 1.7;

    color: var(--red-hi);

    text-shadow:

        4px 4px 0 var(--red-lo),

        7px 7px 0 #050307;
}


.logo p {

    margin:

        12px 0 0;

    color: var(--muted);

    font-size: 25px;
}


/* =================================
   FORM
================================= */

.field {

    margin-bottom: 20px;
}


.field label {

    display: block;

    margin-bottom: 8px;

    color: var(--paper);

    font-family: var(--font-display);

    font-size: 10px;

    text-shadow:
        2px 2px 0 #000;
}


.field input {

    width: 100%;

    height: 53px;

    padding: 10px 14px;

    background: #08060c;

    border:

        4px solid #050307;

    color: white;

    outline: none;

    font-family: var(--font-body);

    font-size: 25px;

    box-shadow:

        inset 4px 4px 0 #000,

        inset -3px -3px 0 #3b3150;
}


.field input:focus {

    border-color: var(--red);

    box-shadow:

        inset 4px 4px 0 #000,

        inset -3px -3px 0 #3b3150,

        0 0 0 2px rgba(224,69,47,.35);
}


.field input::placeholder {

    color: #716b7b;
}


/* =================================
   LOGIN BUTTON
================================= */

.login-button {

    width: 100%;

    min-height: 58px;

    border:

        4px solid var(--red-lo);

    background:

        linear-gradient(
            #ff6245,
            #e0452f,
            #a9281c
        );

    color: white;

    font-family: var(--font-display);

    font-size: 11px;

    text-shadow:

        3px 3px 0 var(--red-lo);

    cursor: pointer;

    box-shadow:

        inset 4px 4px 0
        rgba(255,255,255,.2),

        inset -4px -4px 0
        rgba(0,0,0,.3);
}


.login-button:hover {

    filter: brightness(1.12);
}


.login-button:active {

    transform: translateY(3px);

    box-shadow:

        inset 4px 4px 0
        rgba(0,0,0,.3);
}


/* =================================
   WARNING
================================= */

.login-error {

    margin-bottom: 18px;

    padding: 12px 14px;

    background: #4a1515;

    border: 3px solid #8b2020;

    color: #ff7777;

    font-family: var(--font-display);

    font-size: 9px;

    line-height: 1.7;

    text-align: center;

    box-shadow:
        4px 4px 0 #161616;

    text-shadow:
        2px 2px 0 #161616;
}


.warning {

    margin-top: 22px;

    padding-top: 18px;

    border-top:

        3px solid #332843;

    text-align: center;

    color: var(--muted);

    font-size: 21px;
}


.warning strong {

    color: var(--red-hi);

    font-family: var(--font-display);

    font-size: 9px;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 500px) {

    .admin-panel {

        padding: 22px;

        border-width: 4px;
    }


    .restricted {

        margin:
            -22px
            -22px
            22px
            -22px;

        font-size: 7px;
    }


    .logo h1 {

        font-size: 17px;
    }


    .logo p {

        font-size: 21px;
    }


    .field input {

        height: 48px;

        font-size: 22px;
    }


    .login-button {

        min-height: 54px;

        font-size: 9px;
    }
}

</style>

</head>


<body>


<!-- CAVE -->

<div class="cave"></div>


<!-- TORCHES -->

<div class="torch torch-left"></div>

<div class="torch torch-right"></div>


<!-- LAVA -->

<div class="lava"></div>


<!-- ADMIN LOGIN -->

<div class="panel-wrapper">

    <main class="admin-panel">


        <div class="restricted">

            ⚠ RESTRICTED AREA ⚠

        </div>


        <div class="logo">

            <h1>
                BLOCKREALM
            </h1>

            <p>
                ADMIN CONTROL
            </p>

        </div>


        {% if error %}
            <div class="login-error">
                ⚠ {{ error }}
            </div>
        {% endif %}

        <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <div class="field">

                <label for="username">
                    ADMIN USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    ADMIN PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="login-button"
                type="submit"
            >
                ENTER CONTROL PANEL
            </button>


        </form>


        <div class="warning">

            <strong>AUTHORIZED PERSONNEL ONLY</strong>

            <br><br>

            All administrative actions are protected.

        </div>


    </main>

</div>


</body>

</html>
