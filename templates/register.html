<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Blockrealm Register</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --sky: #6fb4f0;
            --sky-low: #b5dcf8;

            --grass: #5fa832;
            --grass-dark: #39751e;

            --dirt: #7a4e2d;

            --stone: #6b6b6b;
            --stone-hi: #a8a8a8;
            --stone-lo: #3b3b3b;

            --gold: #ffcc33;

            --font-display:
                "Press Start 2P",
                "Courier New",
                monospace;

            --font-body:
                "VT323",
                "Courier New",
                monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;

            background:
                linear-gradient(
                    var(--sky) 0%,
                    var(--sky) 55%,
                    var(--sky-low) 100%
                );

            color: white;
            font-family: var(--font-body);
        }

        /* CLOUDS */

        .cloud {
            position: absolute;

            width: 130px;
            height: 30px;

            background: white;

            box-shadow:
                0 8px 0 rgba(255,255,255,0.8);

            opacity: 0.9;
        }

        .cloud::before,
        .cloud::after {
            content: "";

            position: absolute;

            background: white;
        }

        .cloud::before {
            width: 55px;
            height: 35px;

            left: 20px;
            bottom: 10px;
        }

        .cloud::after {
            width: 75px;
            height: 40px;

            left: 55px;
            bottom: 5px;
        }

        .cloud-1 {
            top: 15%;
            left: -160px;

            animation:
                moveCloud 35s linear infinite;
        }

        .cloud-2 {
            top: 28%;
            left: -160px;

            transform: scale(.75);

            opacity: .7;

            animation:
                moveCloud 48s linear infinite;

            animation-delay: 8s;
        }

        @keyframes moveCloud {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(
                    calc(100vw + 400px)
                );
            }
        }

        /* GROUND */

        .ground {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 28vh;

            min-height: 150px;

            background: var(--dirt);

            border-top:
                18px solid var(--grass);

            box-shadow:
                inset 0 8px 0 var(--grass-dark);

            z-index: 1;
        }

        /* PANEL */

        .panel-wrapper {
            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 5;

            padding-bottom: 6vh;
        }

        .register-panel {
            width: min(
                450px,
                calc(100vw - 32px)
            );

            padding: 30px;

            background: var(--stone);

            border:
                5px solid var(--stone-lo);

            box-shadow:

                inset 5px 5px 0 var(--stone-hi),

                inset -5px -5px 0 #222,

                10px 10px 0 rgba(0,0,0,.35);
        }

        /* TITLE */

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            font-family: var(--font-display);

            font-size: 22px;

            line-height: 1.7;

            text-shadow:
                4px 4px 0 #222;
        }

        .logo p {
            margin: 10px 0 0;

            font-size: 24px;

            color: #e5e5e5;
        }

        /* FORM */

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-family: var(--font-display);

            font-size: 10px;

            text-shadow:
                2px 2px 0 #333;
        }

        .field input {
            width: 100%;

            height: 50px;

            padding: 10px 14px;

            border:
                4px solid #252525;

            background: #111;

            color: white;

            outline: none;

            font-family: var(--font-body);

            font-size: 24px;

            box-shadow:
                inset 3px 3px 0 #000,
                inset -3px -3px 0 #333;
        }

        .field input:focus {
            border-color: var(--gold);
        }

        .field input::placeholder {
            color: #777;
        }

        /* BUTTON */

        .register-button {
            width: 100%;

            min-height: 58px;

            border:
                4px solid #245d16;

            background:
                linear-gradient(
                    #75df45,
                    #55b92d,
                    #3d9620
                );

            color: white;

            font-family: var(--font-display);

            font-size: 11px;

            text-shadow:
                3px 3px 0 #246314;

            cursor: pointer;

            box-shadow:

                inset 4px 4px 0
                rgba(255,255,255,.25),

                inset -4px -4px 0
                rgba(0,0,0,.25);
        }

        .register-button:hover {
            filter: brightness(1.12);
        }

        .register-button:active {
            transform: translateY(3px);
        }

        /* LOGIN LINK */

        .login {
            margin-top: 22px;

            padding-top: 18px;

            border-top:
                3px solid var(--stone-lo);

            text-align: center;

            font-size: 22px;
        }

        .login a {
            display: inline-block;

            margin-top: 8px;

            color: var(--gold);

            font-family: var(--font-display);

            font-size: 9px;

            text-decoration: none;

            text-shadow:
                2px 2px 0 #333;
        }

        .login a:hover {
            color: white;
        }

        @media (max-width: 500px) {

            .register-panel {
                padding: 22px;
            }

            .logo h1 {
                font-size: 17px;
            }

            .field input {
                font-size: 21px;
            }

            .register-button {
                font-size: 10px;
            }
        }

    </style>

</head>


<body>

    <!-- SKY -->

    <div class="cloud cloud-1"></div>

    <div class="cloud cloud-2"></div>


    <!-- GROUND -->

    <div class="ground"></div>


    <!-- REGISTER PANEL -->

    <div class="panel-wrapper">

        <main class="register-panel">

            <div class="logo">

                <h1>
                    CREATE ACCOUNT
                </h1>

                <p>
                    Start your adventure.
                </p>

            </div>


            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">

                    <label for="name">
                        USERNAME
                    </label>

                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="Choose username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="age">
                        AGE
                    </label>

                    <input
                        id="age"
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    class="register-button"
                    type="submit"
                >
                    CREATE ACCOUNT
                </button>

            </form>


            <div class="login">

                Already have an account?

                <br>

                <a href="/login">
                    BACK TO LOGIN
                </a>

            </div>

        </main>

    </div>

</body>

</html>
