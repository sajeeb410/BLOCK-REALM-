<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat with {{ other_user["name"] }} | Blockrealm</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#fff;
    overflow:hidden;

    background:
        linear-gradient(rgba(35,25,15,.35),rgba(20,15,10,.55)),
        repeating-linear-gradient(
            90deg,
            #76502f 0px,
            #76502f 58px,
            #684526 58px,
            #684526 61px
        );
}

/* WALL PLANKS */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 78px,
            rgba(30,18,8,.28) 79px,
            rgba(30,18,8,.28) 82px
        );

    opacity:.8;
}

/* FLOOR */

.floor{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:115px;
    z-index:-1;

    background:
        repeating-linear-gradient(
            90deg,
            #805631 0px,
            #805631 74px,
            #684323 75px,
            #684323 79px
        );

    border-top:8px solid #4b2d18;
}

/* WINDOW */

.window{
    position:fixed;
    top:35px;
    left:35px;

    width:145px;
    height:105px;

    background:
        linear-gradient(
            rgba(75,125,155,.45),
            rgba(25,55,75,.8)
        );

    border:12px solid #4a2b18;
    box-shadow:
        inset 0 0 0 5px #8b5b32,
        0 8px 15px rgba(0,0,0,.45);
}

.window::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:7px;
    background:#4a2b18;
    transform:translateX(-50%);
}

.window::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:50%;
    height:7px;
    background:#4a2b18;
    transform:translateY(-50%);
}

/* LANTERNS */

.lantern{
    position:fixed;
    top:15px;
    width:32px;
    height:48px;

    background:
        linear-gradient(
            90deg,
            #472818,
            #9c612c,
            #4b2918
        );

    border:4px solid #321b10;
    border-radius:5px;

    box-shadow:
        0 0 18px rgba(255,190,70,.65),
        0 0 45px rgba(255,155,40,.25);

    animation:glow 2.5s infinite alternate;
}

.lantern.left{
    left:215px;
}

.lantern.right{
    right:215px;
}

.lantern::before{
    content:"";
    position:absolute;
    top:-15px;
    left:9px;
    width:6px;
    height:15px;
    background:#302015;
}

@keyframes glow{
    from{
        filter:brightness(.9);
        box-shadow:0 0 13px rgba(255,180,50,.5);
    }
    to{
        filter:brightness(1.15);
        box-shadow:0 0 25px rgba(255,190,70,.8);
    }
}

/* MAIN ROOM */

.chat-container{
    position:relative;

    width:min(1000px,94vw);
    height:calc(100vh - 55px);

    margin:27px auto;

    display:flex;
    flex-direction:column;

    background:#342318;

    border:9px solid #3c2414;

    box-shadow:
        0 0 0 4px #79502d,
        0 18px 40px rgba(0,0,0,.65);

    overflow:hidden;
}

/* HEADER */

.chat-header{
    min-height:82px;

    display:flex;
    align-items:center;
    gap:15px;

    padding:12px 16px;

    background:
        repeating-linear-gradient(
            90deg,
            #704724 0px,
            #704724 62px,
            #5e3a1e 63px,
            #5e3a1e 67px
        );

    border-bottom:7px solid #392211;

    box-shadow:inset 0 -3px rgba(255,255,255,.08);
}

.back-button{
    text-decoration:none;
    color:#fff;

    padding:11px 14px;

    background:#4c2d18;

    border:4px solid #2b180d;

    box-shadow:
        inset 3px 3px rgba(255,255,255,.12),
        3px 4px rgba(0,0,0,.35);

    font-weight:bold;
    font-size:13px;

    transition:.15s;
}

.back-button:hover{
    transform:translateY(-2px);
    filter:brightness(1.2);
}

.avatar-frame{
    width:50px;
    height:50px;
    flex-shrink:0;

    padding:4px;

    background:#9b693a;

    border:4px solid #3b2414;
    box-shadow:inset 0 0 0 2px #c18a4e;
}

.avatar-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.avatar-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#6b4325;
    font-size:24px;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:19px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:2px 2px #29170d;
}

.online{
    margin-top:4px;
    font-size:12px;
    color:#9cff72;
    font-weight:bold;
}

/* MESSAGES */

.messages{
    flex:1;

    overflow-y:auto;

    padding:24px 20px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,180,80,.08),
            transparent 55%
        ),
        #211810;
}

/* SCROLLBAR */

.messages::-webkit-scrollbar{
    width:12px;
}

.messages::-webkit-scrollbar-track{
    background:#2b1a10;
}

.messages::-webkit-scrollbar-thumb{
    background:#76502d;
    border:3px solid #2b1a10;
}

.message-row{
    display:flex;
    margin-bottom:16px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message{
    max-width:min(70%,560px);

    padding:12px 15px;

    border:4px solid #2c1a0e;

    box-shadow:
        4px 5px 0 rgba(0,0,0,.35),
        inset 2px 2px rgba(255,255,255,.08);

    word-wrap:break-word;

    line-height:1.45;
}

.mine .message{
    background:
        linear-gradient(#4d8b3c,#3d702f);

    border-color:#27451e;
}

.theirs .message{
    background:
        linear-gradient(#795333,#604126);

    border-color:#3b2616;
}

.message-text{
    font-size:15px;
}

.message-time{
    margin-top:6px;

    text-align:right;

    font-size:10px;

    color:rgba(255,255,255,.65);
}

/* SEND AREA */

.send-area{
    display:flex;
    gap:10px;

    padding:13px;

    background:
        repeating-linear-gradient(
            90deg,
            #66401f 0px,
            #66401f 68px,
            #58361c 69px,
            #58361c 73px
        );

    border-top:7px solid #351f11;
}

.send-area input{
    flex:1;

    min-width:0;

    padding:14px 15px;

    border:4px solid #2c1a0e;
    outline:none;

    background:#24170f;

    color:#fff;

    font-size:15px;

    box-shadow:
        inset 0 3px 6px rgba(0,0,0,.45);
}

.send-area input::placeholder{
    color:#a99078;
}

.send-area input:focus{
    border-color:#8a6036;
}

.send-button{
    border:4px solid #29441f;

    background:
        linear-gradient(#62a94d,#3f7c32);

    color:white;

    padding:0 25px;

    font-weight:bold;
    font-size:14px;

    cursor:pointer;

    box-shadow:
        inset 2px 2px rgba(255,255,255,.13),
        4px 4px rgba(0,0,0,.3);

    transition:.12s;
}

.send-button:hover{
    filter:brightness(1.15);
}

.send-button:active{
    transform:translate(2px,2px);
    box-shadow:2px 2px rgba(0,0,0,.3);
}

/* EMPTY */

.empty-chat{
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#9b826b;
    font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

    body{
        overflow:hidden;
    }

    .floor{
        height:75px;
    }

    .window{
        left:10px;
        top:10px;
        transform:scale(.7);
        transform-origin:top left;
    }

    .lantern.left{
        left:auto;
        right:70px;
    }

    .lantern.right{
        display:none;
    }

    .chat-container{
        width:100%;
        height:100vh;
        margin:0;

        border-width:5px;
    }

    .chat-header{
        min-height:70px;
        padding:9px;
        gap:9px;
    }

    .back-button{
        padding:9px 10px;
        font-size:11px;
    }

    .avatar-frame{
        width:42px;
        height:42px;
    }

    .user-name{
        font-size:16px;
    }

    .messages{
        padding:18px 10px;
    }

    .message{
        max-width:82%;
        padding:10px 12px;
    }

    .message-text{
        font-size:14px;
    }

    .send-area{
        padding:9px;
        gap:7px;
    }

    .send-area input{
        padding:12px 10px;
        font-size:14px;
    }

    .send-button{
        padding:0 14px;
        font-size:12px;
    }
}

/* USER NAME VISIBILITY FIX */

.chat-container{
    position:relative;
    z-index:10;
}

.chat-header{
    position:relative;
    z-index:20;
}

.user-info{

    min-width:0;
}

.user-name{
    position:relative;
    z-index:31;
    display:block;
    visibility:visible;

}

<body>

<div class="floor"></div>

<div class="window"></div>

<div class="lantern left"></div>
<div class="lantern right"></div>

<div class="chat-container">

    <div class="chat-header">

        <a href="/chat" class="back-button">
            ← BACK
        </a>

        <div class="avatar-frame">
            {% if other_user["avatar"] %}
                <img
                    src="{{ url_for('static', filename='profile/' + other_user['avatar']) }}"
                    alt="{{ other_user['name'] }}"
                >
            {% else %}
                <div class="avatar-placeholder">👤</div>
            {% endif %}
        </div>

        <div class="user-info">

            <div class="user-name">
                {{ other_user["name"] }}
            </div>

            <div class="online">
                🟢 VILLAGER ONLINE
            </div>

        </div>

    </div>

    <div class="messages" id="messages">

        {% if messages %}

            {% for message in messages %}

                <div
                    class="message-row {% if message['sender_id'] == session['user_id'] %}mine{% else %}theirs{% endif %}"
                    data-message-id="{{ message['id'] }}"
                >

                    <div class="message">

                        <div class="message-text">
                            {{ message["message"] }}
                        </div>

                        <div class="message-time">
                            {{ message["created_at"] }}
                        </div>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty-chat">
                🏠 No messages yet.<br>
                Start a conversation from the village.
            </div>

        {% endif %}

    </div>


    <form
        class="send-area"
        method="POST"
        action="/chat/{{ other_user['id'] }}/send"
    >
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="message"
            id="messageInput"
            placeholder="Write a message..."
            autocomplete="off"
            required
        >

        <button
            type="submit"
            class="send-button"
        >
            SEND
        </button>

    </form>

</div>


<script>

const messagesBox = document.getElementById("messages");
const input = document.getElementById("messageInput");

const otherUserId = {{ other_user["id"] }};

function scrollToBottom(){

    messagesBox.scrollTop = messagesBox.scrollHeight;

}

scrollToBottom();


function getLastMessageId(){

    const rows = messagesBox.querySelectorAll("[data-message-id]");

    if(!rows.length){
        return 0;
    }

    return parseInt(
        rows[rows.length - 1].dataset.messageId
    );

}


let lastMessageId = getLastMessageId();


async function checkMessages(){

    try{

        const response = await fetch(
            `/chat/${otherUserId}/messages`
        );

        if(!response.ok){
            return;
        }

        const data = await response.json();

        if(!data.length){
            return;
        }

        const newestId = data[data.length - 1].id;

        if(newestId > lastMessageId){

            location.reload();

        }

    }catch(error){

        console.log("Message check failed:",error);

    }

}


setInterval(checkMessages,2000);


window.addEventListener("load",function(){

    input.focus();

    input.setSelectionRange(
        input.value.length,
        input.value.length
    );

});


</script>

</body>
</html>
